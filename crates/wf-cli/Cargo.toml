[package]
name = "wf-cli"
version = "0.1.0"
edition = "2021"
description = "Native Harness workflow runtime used by Agent-facing wf adapters."
license = "MIT"

[[bin]]
name = "wf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

